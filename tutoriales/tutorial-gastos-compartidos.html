<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos compartidos: cómo se usa</title>
<meta name="description" content="Recorrido de 1 minuto por la app para llevar los gastos de una pareja.">
<style>
:root{--acento:#0f8f6a;--fondo:#f6f4ef;--tinta:#1f1d1a;--tenue:#77726a;--suave:#e4e0d7}
@media (prefers-color-scheme: dark){:root{--fondo:#161514;--tinta:#efece5;--tenue:#9a958c;--suave:#2c2a27}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:28px 20px 0}
h1{font-size:clamp(19px,2.6vw,26px);margin:0;line-height:1.2;font-weight:700}
.lema{margin:6px 0 0;color:var(--tenue);font-size:15px;letter-spacing:.01em}
.lema b{color:var(--acento);font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;gap:26px;padding:24px 20px 32px;max-width:980px;width:100%;margin:0 auto}
@media (min-width:880px){main{flex-direction:row;justify-content:center;gap:64px;padding-top:32px}}
.celu{position:relative;flex:none;width:min(100%,330px);aspect-ratio:390/844;border-radius:34px;background:#0c0c0c;padding:7px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
@media (min-width:880px) and (min-height:700px){.celu{width:min(330px,calc((100vh - 200px)*390/844))}}
.pantalla{cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;width:100%;height:100%;border-radius:27px;overflow:hidden;background:#fff}
.pantalla img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
.pantalla img.on{opacity:1}
.anillo{position:absolute;border:3px solid var(--acento);border-radius:12px;opacity:0;pointer-events:none;transition:opacity .3s ease}
.anillo.on{opacity:1;animation:latido 1.4s ease-in-out infinite}

.anillo.aviso{animation:aviso .5s ease}
@keyframes aviso{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes latido{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--acento) 18%,transparent)}}
.cursor{position:absolute;width:30px;height:30px;left:0;top:0;pointer-events:none;opacity:0;transition:left .95s cubic-bezier(.45,.05,.2,1),top .95s cubic-bezier(.45,.05,.2,1),opacity .3s ease,transform .15s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));z-index:3}
.cursor.on{opacity:1}
.cursor.toque{transform:scale(.82)}
.onda{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:color-mix(in srgb,var(--acento) 45%,transparent);transform:scale(0);opacity:0;pointer-events:none;z-index:2}
.onda.va{animation:onda .55s ease-out}
@keyframes onda{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.texto{width:100%;max-width:400px}
.num{color:var(--acento);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.texto h2{margin:4px 0 10px;font-size:clamp(22px,3vw,30px);line-height:1.2}
.texto p{margin:0;font-size:18px;color:var(--tenue);min-height:3em}
.mando{display:flex;align-items:center;gap:10px;margin-top:26px}
button{font:inherit;color:var(--tinta);background:transparent;border:0;cursor:pointer;display:grid;place-items:center}
button:focus-visible,a:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.redondo{width:46px;height:46px;border-radius:50%;background:var(--suave);font-size:20px}
.redondo:disabled{opacity:.35;cursor:default}
.redondo.fuerte{width:54px;height:54px;background:var(--acento);color:#fff}
.redondo svg{width:20px;height:20px;fill:currentColor}
.puntos{display:flex;flex-wrap:wrap;gap:2px;margin-left:8px}
.puntos button{width:20px;height:28px}
.puntos button::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--suave);transition:background .2s,transform .2s}
.puntos button.hecho::after{background:color-mix(in srgb,var(--acento) 45%,var(--suave))}
.puntos button.on::after{background:var(--acento);transform:scale(1.35)}
footer{text-align:center;padding:0 20px 28px;color:var(--tenue);font-size:14px}
footer a{color:var(--tinta);font-weight:600;text-underline-offset:3px}
@media (max-width:879px){
header{padding:14px 16px 0}.lema{font-size:13px;margin-top:2px}h1{font-size:17px}
main{padding:12px 16px 200px;gap:0}
.celu{width:min(100%,250px);border-radius:28px;padding:6px}.pantalla{border-radius:22px}
.texto{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:none;background:var(--fondo);padding:14px 18px 12px;box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.texto h2{font-size:19px;margin:0 0 4px}.texto p{font-size:15px;line-height:1.4;min-height:2.8em}
.num{font-size:12px}
.mando{margin-top:10px}.redondo{width:40px;height:40px}.redondo.fuerte{width:46px;height:46px}
.puntos{display:none}
footer{padding-bottom:200px}
}
@media (prefers-reduced-motion:reduce){.pantalla img,.cursor{transition-duration:.01s}.anillo.on{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Gastos compartidos: cómo se usa</h1>
  <p class="lema">Hecho con <b>IA</b>, pensado por <b>personas</b>.</p>
</header>
<main>
  <div class="celu" aria-label="Demostración: tocá la pantalla donde está marcado para avanzar"><div class="pantalla" id="pantalla">
    <img id="a" alt=""><img id="b" alt="">
    <div class="anillo" id="anillo"></div>
    <div class="onda" id="onda"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 3l16 10.5-7 1.6 4.2 8.2-3.4 1.7-4.2-8.3L5 22z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div></div>
  <section class="texto" aria-live="polite">
    <div class="num" id="num"></div>
    <h2 id="tit"></h2>
    <p id="txt"></p>
    <div class="mando">
      <button id="ant" class="redondo" type="button" aria-label="Paso anterior"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <button id="pp" class="redondo fuerte" type="button" aria-label="Pausar"></button>
      <button id="sig" class="redondo" type="button" aria-label="Paso siguiente"><svg viewBox="0 0 24 24"><path d="M8.6 18.6 10 20l8-8-8-8-1.4 1.4 6.6 6.6z"/></svg></button>
      <div class="puntos" id="puntos"></div>
    </div>
  </section>
</main>

const $ = (id) => document.getElementById(id);
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICONO = { pausa: '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>', play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', otra: '<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>' };
let i = 0, jugando = false, timers = [], cx = 1.05, cy = 1.05;
const A = $("a"), B = $("b");
let frente = A;

PASOS.forEach((p, k) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", "Ir al paso " + (k + 1) + ": " + p.t); b.title = p.t;
  b.onclick = () => ir(k); $("puntos").appendChild(b);
});
const puntos = [...$("puntos").children];

function limpiar() { timers.forEach(clearTimeout); timers = []; }
function en(ms, f) { timers.push(setTimeout(f, ms)); }
function boton() {
  const fin = !jugando && i === PASOS.length - 1;
  $("pp").innerHTML = jugando ? ICONO.pausa : fin ? ICONO.otra : ICONO.play;
  $("pp").setAttribute("aria-label", jugando ? "Pausar" : fin ? "Ver de nuevo" : "Reproducir");
}

function pintar(k) {
  const p = PASOS[k], atras = frente === A ? B : A;
  atras.src = IMGS[k]; atras.classList.add("on"); frente.classList.remove("on"); frente = atras;
  $("num").textContent = "Paso " + (k + 1) + " de " + PASOS.length;
  $("tit").textContent = p.t; $("txt").textContent = p.x;
  puntos.forEach((b, j) => { b.classList.toggle("on", j === k); b.classList.toggle("hecho", j < k); });
  $("ant").disabled = k === 0;
  $("sig").disabled = k === PASOS.length - 1;
  boton();
}

function ir(k) {
  limpiar();
  i = Math.max(0, Math.min(PASOS.length - 1, k));
  pintar(i);
  const p = PASOS[i], an = $("anillo"), cu = $("cursor"), on = $("onda");
  an.classList.remove("on", "aviso"); cu.classList.remove("toque");
  if (p.r) {
    const pad = 0.012;
    an.style.left = (p.r.x - pad) * 100 + "%"; an.style.top = (p.r.y - pad * 0.5) * 100 + "%";
    an.style.width = (p.r.w + pad * 2) * 100 + "%"; an.style.height = (p.r.h + pad) * 100 + "%";
  }
  const dur = Math.max(4200, 2600 + (p.x.length + p.t.length) * 32);
  const ver = p.g === "ver" || !p.r;
  if (ver) { cu.classList.remove("on"); if (p.r) en(500, () => an.classList.add("on")); cx = 1.05; cy = 1.05; }
  else {
    const tx = p.r.x + p.r.w / 2, ty = p.r.y + p.r.h / 2;
    cu.classList.add("on");
    cu.style.left = cx * 100 + "%"; cu.style.top = cy * 100 + "%";
    en(350, () => an.classList.add("on"));
    en(450, () => { cu.style.left = "calc(" + tx * 100 + "% - 8px)"; cu.style.top = "calc(" + ty * 100 + "% - 4px)"; });
    if (jugando) { en(1550, () => onda(tx, ty, true)); en(1750, () => cu.classList.remove("toque")); }
    cx = tx; cy = ty;
  }
  if (jugando) en(dur, () => { if (i < PASOS.length - 1) ir(i + 1); else { jugando = false; boton(); } });
}

function onda(x, y, conCursor) {
  const on = $("onda");
  if (conCursor) $("cursor").classList.add("toque");
  on.style.left = x * 100 + "%"; on.style.top = y * 100 + "%"; on.classList.remove("va"); void on.offsetWidth; on.classList.add("va");
}
// Modo interactivo: tocar donde está marcado lleva al paso siguiente.
$("pantalla").addEventListener("click", (e) => {
  const c = e.currentTarget.getBoundingClientRect(), x = (e.clientX - c.left) / c.width, y = (e.clientY - c.top) / c.height;
  const p = PASOS[i], m = 0.04;
  const dentro = !p.r || p.g === "ver" || (x > p.r.x - m && x < p.r.x + p.r.w + m && y > p.r.y - m && y < p.r.y + p.r.h + m);
  if (!dentro) { const an = $("anillo"); an.classList.remove("aviso"); void an.offsetWidth; an.classList.add("aviso"); return; }
  if (jugando) { jugando = false; }
  onda(x, y);
  limpiar();
  if (i < PASOS.length - 1) en(380, () => ir(i + 1)); else boton();
});
$("pp").onclick = () => {
  if (!jugando && i === PASOS.length - 1) { jugando = true; ir(0); return; }
  jugando = !jugando; ir(i);
};
$("ant").onclick = () => ir(i - 1);
$("sig").onclick = () => ir(i + 1);
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") ir(i + 1);
  else if (e.key === "ArrowLeft") ir(i - 1);
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); $("pp").click(); }
});
ir(0);
